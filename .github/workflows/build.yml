# ============================================================
# Excel处理器 - GitHub Actions 一键打包
# 自动构建: Windows / macOS / Linux(x86_64) / Linux(arm64, 信创同架构)
#
# 触发方式:
#   1. 手动: 仓库 Actions 页面 → 本工作流 → Run workflow
#   2. 推送 tag: git tag v1.0 && git push origin v1.0
#
# 产物在每次运行完成后上传到 Actions 的 Artifacts 区域。
# ============================================================
name: 打包发布

on:
  workflow_dispatch:          # 支持手动触发
  push:
    tags: ['v*']              # 推送 v 开头 tag 时自动触发

jobs:
  # ---------- Windows ----------
  build-windows:
    name: Windows 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行 Windows 打包
        shell: cmd
        run: build_windows.bat

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: excel-processor-windows
          path: dist/*.exe

  # ---------- macOS ----------
  build-macos:
    name: macOS 打包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行 macOS 打包
        run: |
          chmod +x build_all.sh build_macos.sh
          ./build_macos.sh

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: excel-processor-macos
          path: |
            dist/*.app

  # ---------- Linux x86_64 ----------
  build-linux-x64:
    name: Linux x86_64 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 tkinter/venv（打包 GUI 必需）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: 执行 Linux 打包
        run: |
          chmod +x build_all.sh build_linux.sh
          ./build_linux.sh

      - name: 上传 Linux x86_64 产物
        uses: actions/upload-artifact@v4
        with:
          name: excel-processor-linux-x64
          path: dist/*

  # ---------- Linux arm64（信创鲲鹏/飞腾同架构） ----------
  build-linux-arm64:
    name: Linux ARM64 打包
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 tkinter/venv（打包 GUI 必需）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv

      - name: 执行 Linux 打包
        run: |
          chmod +x build_all.sh build_linux.sh
          ./build_linux.sh

      - name: 上传 Linux arm64 产物
        uses: actions/upload-artifact@v4
        with:
          name: excel-processor-linux-arm64
          path: dist/*

# File Agent Intent —— Dify Chatflow DSL
# 用途：识别运维人员自然语言需求，输出结构化 JSON 指令（配合 excel_processor.py 的文件处理 Agent）
# 导入方式：Dify 工作台 → 导入 DSL 文件 → 选择本文件
# 注意：导入后请在 LLM 节点中把模型切换为你实例可用的模型（默认占位 openai/gpt-4o-mini）
app:
  description: 识别运维人员的文件处理需求，输出结构化 JSON 指令（供 excel_processor.py 文件处理 Agent 使用）
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: File Agent Intent
  kind: app
workflow:
  id: 4b1c9d4e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
  graph:
    edges:
      - id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        source: 11111111-1111-1111-1111-111111111111
        sourceHandle: source
        target: 22222222-2222-2222-2222-222222222222
        targetHandle: target
      - id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
        source: 22222222-2222-2222-2222-222222222222
        sourceHandle: source
        target: 33333333-3333-3333-3333-333333333333
        targetHandle: target
    nodes:
      - data:
          type: start
          title: 开始
          variables: []
        id: 11111111-1111-1111-1111-111111111111
        position:
          x: 0
          y: 0
      - data:
          type: llm
          title: 意图识别
          version: '1'
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 2048
          prompt_template:
            - id: 44444444-4444-4444-4444-444444444444
              role: system
              text: |-
                你是一个严格的 JSON 输出助手。用户输入中会包含 Excel 文件列结构说明、任务选项清单、可选的历史对话背景与运维需求描述。

                请根据用户输入，从给定任务中选择最匹配的一个并提取参数，只输出一个 JSON 对象，不要输出任何其他内容（不要使用代码围栏，不要添加解释）。输出格式为：
                {
                  "task": "任务名",
                  "params": {},
                  "confidence": 0到1的置信度,
                  "understanding": "用1-2句话复述你对用户需求的理解（供用户确认）",
                  "clarify_questions": ["需求中含糊或缺失的关键信息问题；明确则为空数组"],
                  "can_use_builtin_tool": true或false
                }

                如果需求无法用给定任务完成，输出 {"task":"custom","params":{},"reason":"简要说明","can_use_builtin_tool":false}。

                澄清规则：
                - 当需求存在歧义、缺少关键参数（统计口径/列名/范围/输出格式等）、或引用了文件列结构中不存在的列时，必须在 clarify_questions 中逐条列出需要用户补充的问题。
                - 当需求明确无歧义时，clarify_questions 必须为空数组 []。

                绝对不要输出本地文件的绝对路径，文件引用一律使用序号索引（file_index）。
          variables:
            - variable_selector:
                - 11111111-1111-1111-1111-111111111111
                - sys.query
              value_selector: null
          context:
            enabled: false
            variable_selector: null
          vision:
            enabled: false
          memory:
            enabled: false
            window:
              enabled: false
              size: 10
          answer: ''
          selected: false
          model_config: {}
        id: 22222222-2222-2222-2222-222222222222
        position:
          x: 240
          y: 0
      - data:
          type: answer
          title: 回答
          answer: '{{#22222222-2222-2222-2222-222222222222.text#}}'
          selected: false
          variables:
            - variable_selector:
                - 22222222-2222-2222-2222-222222222222
                - text
              value_selector: null
        id: 33333333-3333-3333-3333-333333333333
        position:
          x: 480
          y: 0
    viewport:
      x: 0
      y: 0
      zoom: 1
  version: 0.1.5
version: 0.1.5
